name: DataPulse CI Pipeline

on:
  push:
    branches: [main, dev, backend, frontend, clouddatabase]
  pull_request:
    branches: [main, dev, backend, frontend, clouddatabase]

jobs:
  test-and-lint:
    name: Run Automated Test Suite (Node.js & API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  frontend:
    name: Build Frontend (Bakya - 24BAI0071)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Package Backend (Udiksha - 24BAI0086)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/spring-boot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -ntp -DskipTests package
